<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队协作看板</title>
<style>
:root {color-scheme:light dark;--page:#f4f5f1;--panel:#fff;--ink:#1a2b24;--muted:#596b61;--line:#d6dfd7;--green:#216944;--accent:#2a6095;--warn:#99451d;--wash:#eaf3eb}
@media (prefers-color-scheme:dark) {:root {--page:#171d1a;--panel:#202824;--ink:#e7eee8;--muted:#a9bab0;--line:#39473f;--green:#8bd3a8;--accent:#92bde6;--warn:#edb08b;--wash:#293b31}}
* {box-sizing:border-box} body {margin:0;background:var(--page);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei UI",sans-serif}
main {max-width:1080px;margin:auto;padding:20px;display:grid;gap:16px}
header,.bar {display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1,h2,h3,p {margin:0} h1 {font-size:25px;letter-spacing:-.035em} h2 {font-size:17px} h3 {font-size:15px}
small,time,.muted {color:var(--muted)} small,time {font-size:12px} button {font:inherit;color:inherit;cursor:pointer}
section {background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}
#tasks {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(215px,100%),1fr));gap:8px;margin-top:10px}
.card,.item {text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 12px;overflow-wrap:anywhere}
.card {display:grid;gap:4px} .card strong {color:var(--green)} .alert {color:var(--warn)} .card:hover,.item:hover,button[aria-pressed=true] {background:var(--wash)}
#graph {display:block;width:100%;height:auto;min-height:100px;max-height:480px;margin-top:6px}
#graph text {font:13px Inter,sans-serif;fill:var(--ink)} #graph .edge {cursor:pointer} #graph .edge:focus {outline:2px solid var(--accent)}
#events {display:grid;gap:5px;max-height:290px;overflow:auto;margin-top:8px}
.item {display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#detail {margin-top:12px;padding-top:10px;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:550px){main{padding:12px;gap:10px}section{padding:12px}.item{display:grid;gap:0}}
</style>
<main>
<header><div><h1>团队协作看板</h1><small id="run"></small></div><span id="connection" role="status">正在连接…</span></header>
<section><div class="bar"><h2>任务</h2><small id="count"></small></div><div id="tasks"></div></section>
<section><div class="bar"><h2>关系图</h2><small>实线 · 通信和分工　虚线 · 任务依赖</small></div>
<svg id="graph" role="group" aria-label="成员与任务的有向关系图"></svg></section>
<section><div class="bar"><h2>消息与审查记录</h2><small id="total"></small></div><div id="events"></div><div id="detail" aria-live="polite"></div></section>
</main>
<script>
"use strict";
const byId = id => document.getElementById(id);
const stateLabels = {assigned:"已派工",submitted:"已提交",returned:"退回修复",approved:"复验通过",released:"已放行",blocked:"阻塞"};
const action = {assign:"派工",message:"发送",reply:"回复",ack:"确认收到",submit:"提交",changes:"退回",approve:"审查通过",release:"放行",depends:"依赖"};
const alerts = {"missing review":"等待独立审查","returned review":"审查已退回","stale review":"审查对应旧版本","conflicting task id":"同一任务存在冲突分工"};
const localTime = iso => new Date(iso).toLocaleTimeString("zh-CN", {hour12:false});
const actor = name => String(name || "").replace(/^@/,"");
let previous = "", selected = "", snapshot, activeRun;
const firstSeen = new Map();
function element(tag, text, className) {
  const el=document.createElement(tag);
  if (text != null) el.textContent=text;
  if (className) el.className=className;
  return el;
}
function graphic(tag, attrs, text) {
  const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for (const [key,value] of Object.entries(attrs)) el.setAttribute(key,String(value));
  if (text != null) el.textContent=text;
  return el;
}
function route(e) {return e.to ? e.from+" → "+actor(e.to) : e.from+" → "+e.task}
function selectEvent(id) {
  selected=id;
  for (const b of byId("events").children) b.setAttribute("aria-pressed",String(b.dataset.id===id));
  const e=snapshot.events.find(item=>item.id===id);
  if (!e) {byId("detail").replaceChildren();return}
  const links=snapshot.events.filter(item=>item.replyTo===id).map(item=>action[item.type]+" "+item.id);
  const seen=firstSeen.get(id);
  const lines=[e.text,e.replyTo && "回应 "+e.replyTo,links.length && "后续记录 "+links.join("、"),e.version && "版本 "+e.version,
    "事件 "+e.at+"　面板接收 "+seen];
  byId("detail").replaceChildren(element("h3",action[e.type]+" · "+e.id), element("p",lines.filter(Boolean).join("\n")));
}
function tasks(s) {
  const area=byId("tasks");area.replaceChildren();byId("count").textContent=s.tasks.length+" 项";
  if (!s.tasks.length) area.append(element("p","等待派工。","muted"));
  for (const t of s.tasks) {
    const list=s.events.filter(e=>e.task===t.id);
    const contact=list.filter(e=>["message","reply","ack"].includes(e.type)).at(-1);
    const card=element("button",null,"card");
    card.append(element("h3",t.id),element("strong",stateLabels[t.status] || t.status),
      element("span","负责 "+t.owner+"　审查 "+(t.reviewer || "按需")));
    if (contact) card.append(element("small","最近通信 "+route(contact)+" · "+action[contact.type]));
    for (const warning of t.alerts) card.append(element("span",alerts[warning] || warning,"alert"));
    card.onclick=()=>selectEvent(list.at(-1)?.id);
    area.append(card);
  }
}
function graph(s) {
  const svg=byId("graph");svg.replaceChildren();
  const nodes=[...new Set([...s.actors,...s.tasks.map(t=>"task:"+t.id),...s.edges.flatMap(e=>[e.from,e.to])])];
  const height=Math.max(170,52*nodes.length), width=530;
  svg.setAttribute("viewBox","0 0 "+width+" "+height);
  const pos=new Map();
  for (const side of [false,true]) {
    const column=nodes.filter(n=>n.startsWith("task:")===side);
    column.forEach((n,i)=>pos.set(n,{x:side?395:125,y:height*(i+1)/(column.length+1)}));
  }
  const defs=graphic("defs",{});svg.append(defs);
  for (const [type,color] of [["normal","var(--accent)"],["dependency","var(--warn)"]]) {
    const marker=graphic("marker",{id:type,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:6,markerHeight:6,orient:"auto"});
    marker.append(graphic("path",{d:"M0 0 L10 5 L0 10 z",fill:color}));defs.append(marker);
  }
  const multiplicity=new Map();
  for (const edge of s.edges) {
    const p=pos.get(edge.from),q=pos.get(edge.to);
    const laneKey=[edge.from,edge.to].sort().join("|"), lane=multiplicity.get(laneKey)||0;
    multiplicity.set(laneKey,lane+1);
    const same=p.x===q.x, sign=p.x<width/2?-1:1, offset=12*(1+lane);
    const startX=p.x+(same?sign*28:(q.x>p.x?34:-34)), endX=q.x+(same?sign*28:(p.x>q.x?34:-34));
    const routePath="M"+startX+" "+p.y+" Q"+(same?p.x+sign*(66+offset):(p.x+q.x)/2)+" "+(same?(p.y+q.y)/2:(p.y+q.y)/2-offset)+" "+endX+" "+q.y;
    const dep=edge.type==="depends", label=(action[edge.type]||edge.type)+" "+edge.from+" → "+edge.to+" · "+edge.eventId;
    const group=graphic("g",{class:"edge",tabindex:0,role:"button","aria-label":label});
    group.append(graphic("title",{},label),graphic("path",{d:routePath,fill:"none",stroke:dep?"var(--warn)":"var(--accent)","stroke-width":2,"stroke-dasharray":dep?"5 4":"none","marker-end":"url(#"+(dep?"dependency":"normal")+")"}),
      graphic("path",{d:routePath,fill:"none",stroke:"transparent","stroke-width":10}));
    group.onclick=()=>selectEvent(edge.eventId);
    group.onkeydown=e=>{if(e.key==="Enter" || e.key===" "){e.preventDefault();group.onclick()}};
    svg.append(group);
  }
  for (const [name,p] of pos) {
    svg.append(graphic("rect",{x:p.x-34,y:p.y-14,width:68,height:28,rx:name.startsWith("task:")?4:14,fill:"var(--wash)",stroke:"var(--line)"}));
    const title=name.replace(/^task:/,"");const node=graphic("text",{x:p.x,y:p.y+4,"text-anchor":"middle"},title.length>10?title.slice(0,9)+"…":title);
    node.append(graphic("title",{},name));svg.append(node);
  }
}
function render(s) {
  snapshot=s;
  if(activeRun!==s.run){firstSeen.clear();selected="";activeRun=s.run}
  const now=new Date().toISOString();
  byId("run").textContent=s.run;
  const list=byId("events");list.replaceChildren();
  byId("total").textContent=s.events.length+" 条";
  for (const e of [...s.events].reverse()) {
    if (!firstSeen.has(e.id)) firstSeen.set(e.id,now);
    const row=element("button",null,"item");row.dataset.id=e.id;
    row.append(element("span",action[e.type]+" · "+route(e)),element("small",e.id+" · "+localTime(e.at)));
    row.onclick=()=>selectEvent(e.id);list.append(row);
  }
  tasks(s);graph(s);selectEvent(selected || s.events.at(-1)?.id);
}
async function poll() {
  try {
    const response=await fetch("/api/state",{cache:"no-store"});
    if(!response.ok) throw Error(String(response.status));
    const raw=await response.text();
    if(raw!==previous){render(JSON.parse(raw));previous=raw}
    byId("connection").textContent="● 实时连接";
  } catch {byId("connection").textContent="连接中断 · 正在重试"}
  setTimeout(poll,850);
}
poll();
</script>
</html>
