name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: windows-latest
    timeout-minutes: 460

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show PowerShell version
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Install and verify pinned JSON Schema validator
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator verification failed with exit code $LASTEXITCODE." }

      - name: Install and verify pinned gitleaks
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks verification failed with exit code $LASTEXITCODE." }

      - name: Run repository validation orchestrator
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-repository-validation'
          $childManifestPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-validation-children-manifest.json'
          $finalManifestPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-validation-final-manifest.json'
          $summaryPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-repository-validation-summary.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\run-repository-validation.ps1') -OutputRoot $outputRoot -ChildArtifactManifestPath $childManifestPath -FinalArtifactManifestPath $finalManifestPath -JsonSummaryPath $summaryPath
          if ($LASTEXITCODE -ne 0) { throw "Repository validation orchestrator failed with exit code $LASTEXITCODE." }
