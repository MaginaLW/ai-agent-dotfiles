      - name: Run test shard 2 of 3
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-test-shard-2-summary.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\run-tests.ps1') -All -JsonSummaryPath $summaryPath -ShardCount 3 -ShardIndex 2
          $shardExitCode = $LASTEXITCODE
          # The job log is not readable without repository admin rights, so a red shard
          # names its failing suites in the failure annotation. Only counts, suite ids,
          # states and exit codes are published: no suite output, paths or artifacts.
          $shardReport = ''
          $summaryShape = $null
