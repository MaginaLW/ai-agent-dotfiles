name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gates:
    name: Validate repository gates
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show PowerShell version
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Install and verify pinned JSON Schema validator
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator verification failed with exit code $LASTEXITCODE." }

      - name: Install and verify pinned gitleaks
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks verification failed with exit code $LASTEXITCODE." }

      # Reviewed operational decision (owner, 2026-09-19): CI passes the test-only
      # -SkipGates parameter to exclude the unified-test-runner gate from this job.
      # The proven 42-suite budget (RequiredJobTimeoutSeconds 27555 s = 459.25 min)
      # exceeds the 360-minute GitHub hosted-runner job ceiling, so the suite matrix
      # runs in the parallel validate-tests-1..3 shard jobs below instead (static
      # partition: tests/test-shards.psd1; per-shard contract asserted by
      # tests/test-runner.tests.ps1). All other gates and the artifact chain run here,
      # exactly once, as before.
      - name: Run repository validation orchestrator
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-repository-validation'
          $childManifestPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-validation-children-manifest.json'
          $finalManifestPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-validation-final-manifest.json'
          $summaryPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-repository-validation-summary.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\run-repository-validation.ps1') -OutputRoot $outputRoot -ChildArtifactManifestPath $childManifestPath -FinalArtifactManifestPath $finalManifestPath -JsonSummaryPath $summaryPath -SkipGates unified-test-runner
          if ($LASTEXITCODE -ne 0) { throw "Repository validation orchestrator failed with exit code $LASTEXITCODE." }

  validate-tests-1:
    name: Validate test shard 1 of 3
    runs-on: windows-latest
    # Shard 1 budget 8280 s + SetupAndNonSuiteBudgetSeconds 300 + MarginSeconds 120
    # = 8700 s = 145 min; headroom to 170 min, below the 360-minute platform ceiling.
    timeout-minutes: 170

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install and verify pinned JSON Schema validator
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator verification failed with exit code $LASTEXITCODE." }

      - name: Install and verify pinned gitleaks
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks verification failed with exit code $LASTEXITCODE." }

      - name: Run test shard 1 of 3
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-test-shard-1-summary.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\run-tests.ps1') -All -JsonSummaryPath $summaryPath -ShardCount 3 -ShardIndex 1
          $shardExitCode = $LASTEXITCODE
          # The job log is not readable without repository admin rights, so a red shard
          # names its failing suites in the failure annotation. Only counts, suite ids,
          # states and exit codes are published: no suite output, paths or artifacts.
          $shardReport = ''
          $summaryShape = $null
          if (Test-Path -LiteralPath $summaryPath) {
            $summaryShape = Get-Content -Raw -LiteralPath $summaryPath | ConvertFrom-Json
            $failingIds = @($summaryShape.Suites | Where-Object { [string]$_.State -cne 'passed' } |
              ForEach-Object { '{0}:{1}:exit={2}' -f $_.SuiteId, $_.State, $_.ExitCode })
            $shardReport = 'discovered={0} passed={1} failed={2} timed-out={3} failing=[{4}]' -f $summaryShape.Counts.Discovered, $summaryShape.Counts.Passed, $summaryShape.Counts.Failed, $summaryShape.Counts.TimedOut, ($failingIds -join ', ')
            if ($shardReport.Length -gt 700) { $shardReport = $shardReport.Substring(0, 700) + '...' }
            Write-Host "shard 1 summary: $shardReport"
          }
          if ($shardExitCode -ne 0) {
            # A pwsh step's throw text never reaches the step annotation, so publish the
            # report as an explicit error annotation, which the public API exposes.
            Write-Host "::error title=Shard 1 failing suites::$shardReport"
            throw "Test shard 1 failed with exit code $shardExitCode. $shardReport"
          }
          if ($null -eq $summaryShape) { throw "Test shard 1 published no summary at $summaryPath." }
          if ([int]$summaryShape.Counts.Passed -ne [int]$summaryShape.Counts.Discovered) { throw "Test shard 1 summary has passed $($summaryShape.Counts.Passed) != discovered $($summaryShape.Counts.Discovered). $shardReport" }

  validate-tests-2:
    name: Validate test shard 2 of 3
    runs-on: windows-latest
    # Shard 2 budget 9180 s + SetupAndNonSuiteBudgetSeconds 300 + MarginSeconds 120
    # = 9600 s = 160 min; headroom to 185 min, below the 360-minute platform ceiling.
    timeout-minutes: 185

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install and verify pinned JSON Schema validator
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator verification failed with exit code $LASTEXITCODE." }

      - name: Install and verify pinned gitleaks
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks install failed with exit code $LASTEXITCODE." }
