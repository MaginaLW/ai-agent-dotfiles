          if ([int]$summary.Counts.Passed -ne [int]$summary.Counts.Discovered) { throw "Test shard 2 summary has passed $($summary.Counts.Passed) != discovered $($summary.Counts.Discovered). $shardReport" }

  validate-tests-3:
    name: Validate test shard 3 of 3
