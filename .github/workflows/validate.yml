name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Run repository doctor
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\doctor.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'scripts/doctor.ps1 is missing; repository doctor is a required validation entry point.'
          }

          $isolatedHome = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-doctor-home'
          New-Item -ItemType Directory -Path $isolatedHome -Force | Out-Null
          $env:HOME = $isolatedHome
          $env:USERPROFILE = $isolatedHome
          Write-Host 'Doctor live-path probes are isolated to the runner temporary directory.'

          & pwsh -NoProfile -File $scriptPath -SkipSecretsScan
          if ($LASTEXITCODE -ne 0) {
            throw "doctor.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Scan for secrets
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\scan-secrets.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'scripts/scan-secrets.ps1 is missing; the secret scan gate is required.'
          }

          $scanJson = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-secret-scan.json'
          & pwsh -NoProfile -File $scriptPath -JsonPath $scanJson
          if ($LASTEXITCODE -ne 0) {
            throw "scan-secrets.ps1 failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath $scanJson -PathType Leaf)) {
            throw 'Secret scan did not produce its machine-readable JSON summary.'
          }
          $scanReport = Get-Content -Raw -LiteralPath $scanJson | ConvertFrom-Json
          if ([int]$scanReport.SchemaVersion -ne 1 -or $scanReport.Result -ne 'PASS') {
            throw 'Secret scan JSON summary is missing or reports a failure.'
          }

      - name: Build generated skills
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\build-skills.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'scripts/build-skills.ps1 is missing; generated-output validation is required.'
          }

          & pwsh -NoProfile -File $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "build-skills.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Verify build leaves Git clean
        shell: pwsh
        run: |
          git diff --quiet --exit-code -- .
          if ($LASTEXITCODE -ne 0) {
            git status --short
            throw 'Build changed tracked files. Rebuild locally and commit the intended source or manifest changes.'
          }

          $untrackedFiles = @(git ls-files --others --exclude-standard)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect untracked files after build.'
          }
          if ($untrackedFiles.Count -gt 0) {
            $untrackedFiles | ForEach-Object { Write-Error "Unexpected untracked file: $_" }
            throw 'Build left unexpected untracked files.'
          }

          $trackedGenerated = @(git ls-files -- claude/skills codex/skills openclaw/skills generated)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect generated output tracking state.'
          }
          if ($trackedGenerated.Count -gt 0) {
            $trackedGenerated | ForEach-Object { Write-Error "Tracked generated output: $_" }
            throw 'Generated output must remain untracked.'
          }

          Write-Host 'Build validation passed: no tracked diff, unexpected untracked files, or tracked generated output.'

      - name: Validate machine-readable schemas and build evidence
        shell: pwsh
        run: |
          $schemaPaths = @(
            'schemas\sync-plan.schema.json',
            'schemas\run-report.schema.json',
            'schemas\doctor-report.schema.json',
            'schemas\secret-scan.schema.json',
            'schemas\harness-env-status.schema.json'
          ) | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE $_ }
          foreach ($schemaPath in $schemaPaths) {
            if (-not (Test-Path -LiteralPath $schemaPath -PathType Leaf)) {
              throw "Required schema is missing: $schemaPath"
            }
            Get-Content -Raw -LiteralPath $schemaPath | ConvertFrom-Json | Out-Null
          }

          $buildReports = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'reports') -Filter 'build-report-*.json' -File)
          if ($buildReports.Count -eq 0) {
            throw 'Build did not produce a machine-readable JSON sidecar.'
          }
          $latest = $buildReports | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $report = Get-Content -Raw -LiteralPath $latest.FullName | ConvertFrom-Json
          foreach ($required in @('SchemaVersion', 'ReportKind', 'GeneratedAtUtc', 'Summary', 'Details', 'Result', 'NextAction')) {
            if (-not ($report.PSObject.Properties.Name -contains $required)) {
              throw "Build JSON report is missing required field: $required"
            }
          }
          if ([int]$report.SchemaVersion -ne 1 -or $report.ReportKind -ne 'build') {
            throw 'Build JSON report has an unsupported schema or report kind.'
          }

          $envStatusJson = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-env-status.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\status-harness-env.ps1') -RepoRoot $env:GITHUB_WORKSPACE -JsonPath $envStatusJson
          if ($LASTEXITCODE -ne 0) { throw "status-harness-env.ps1 failed with exit code $LASTEXITCODE." }
          $envStatus = Get-Content -Raw -LiteralPath $envStatusJson | ConvertFrom-Json
          if ([int]$envStatus.SchemaVersion -ne 1 -or -not ($envStatus.PSObject.Properties.Name -contains 'Environments')) {
            throw 'Harness environment JSON status summary is invalid.'
          }
          Write-Host "Machine-readable evidence validated: $latest"

      - name: Run sync regression tests
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'tests\sync.tests.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'tests/sync.tests.ps1 is missing; the transactional sync regression suite is required.'
          }
          & pwsh -NoProfile -File $scriptPath
          if ($LASTEXITCODE -ne 0) { throw "sync.tests.ps1 failed with exit code $LASTEXITCODE." }

      - name: Run import and merge regression tests
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'tests\skills-import.tests.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'tests/skills-import.tests.ps1 is missing; the import/merge regression suite is required.'
          }
          & pwsh -NoProfile -File $scriptPath
          if ($LASTEXITCODE -ne 0) { throw "skills-import.tests.ps1 failed with exit code $LASTEXITCODE." }

      - name: Run plugin and doctor regression tests
        shell: pwsh
        run: |
          foreach ($relative in @('tests\openclaw-plugin.tests.ps1', 'tests\doctor.tests.ps1')) {
            $scriptPath = Join-Path $env:GITHUB_WORKSPACE $relative
            if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
              throw "$relative is missing; the reliability regression suite is required."
            }
            & pwsh -NoProfile -File $scriptPath
            if ($LASTEXITCODE -ne 0) { throw "$relative failed with exit code $LASTEXITCODE." }
          }

      - name: Run harness profile tests
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'tests\harness-profile.tests.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'tests/harness-profile.tests.ps1 is missing; the harness profile regression suite is required.'
          }

          & pwsh -NoProfile -File $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "harness-profile.tests.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Run harness env tests
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'tests\harness-env.tests.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'tests/harness-env.tests.ps1 is missing; the harness environment regression suite is required.'
          }

          & pwsh -NoProfile -File $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "harness-env.tests.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Reject dangerous tracked files
        shell: pwsh
        run: |
          $trackedFiles = @(git ls-files)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate tracked files.'
          }

          $violations = foreach ($relativePath in $trackedFiles) {
            $normalizedPath = $relativePath -replace '\\', '/'
            $leafName = [System.IO.Path]::GetFileName($normalizedPath)
            $isForbidden = (
                $leafName -match '(?i)\.(pem|key|p12|pfx)$' -or
                $leafName -match '(?i)^id_(rsa|ed25519)$' -or
                $leafName -match '(?i)^\.env(?:\..+)?$' -or
                $leafName -match '(?i)^\.?tokens?(?:\.(txt|json|ya?ml))?$' -or
                $leafName -match '(?i)\.tokens?$' -or
                $leafName -match '(?i)^(auth|\.credentials)\.json$' -or
                $normalizedPath -match '(?i)(^|/)(backup|backups)(/|$)' -or
                $normalizedPath -match '(?i)(^|/)\.ssh(/|$)'
            )

            if ($isForbidden) {
              $relativePath
            }
          }

          $violations = @($violations)
          if ($violations.Count -gt 0) {
            $violations | Sort-Object -Unique | ForEach-Object { Write-Error "Forbidden tracked file: $_" }
            throw 'Dangerous files are tracked. Remove them from Git history and rotate exposed credentials if necessary.'
          }

          Write-Host 'Dangerous tracked-file check passed.'
