name: Validate

# One job on every push to main, every pull request and manual dispatch.
# The gates (syntax, gitleaks, build, secret scan, doctor, manifests parity,
# the full test suite, dangerous files, clean tree) run in
# scripts/run-repository-validation.ps1 and stop at the first failure.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned gitleaks
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks install failed with exit code $LASTEXITCODE." }

      - name: Verify pinned gitleaks
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks verification failed with exit code $LASTEXITCODE." }

      - name: Run repository validation
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\run-repository-validation.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Repository validation failed with exit code $LASTEXITCODE." }