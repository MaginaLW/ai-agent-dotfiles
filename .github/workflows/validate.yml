name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show PowerShell version
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Install and verify pinned JSON Schema validator
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-schema-validator.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned JSON Schema validator verification failed with exit code $LASTEXITCODE." }

      - name: Install and verify pinned gitleaks
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks install failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\install-gitleaks.ps1') -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Pinned gitleaks verification failed with exit code $LASTEXITCODE." }

      - name: Validate registered JSON artifacts
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-artifact-validation.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\validate-json-artifacts.ps1') -All -JsonSummaryPath $summaryPath
          if ($LASTEXITCODE -ne 0) { throw "Registered artifact validation failed with exit code $LASTEXITCODE." }

      - name: Run repository doctor
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\doctor.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'scripts/doctor.ps1 is missing; repository doctor is a required validation entry point.'
          }

          $isolatedHome = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-doctor-home'
          New-Item -ItemType Directory -Path $isolatedHome -Force | Out-Null
          $env:HOME = $isolatedHome
          $env:USERPROFILE = $isolatedHome
          Write-Host 'Doctor live-path probes are isolated to the runner temporary directory.'

          & pwsh -NoProfile -File $scriptPath -HomeRoot $isolatedHome -SkipSecretsScan
          if ($LASTEXITCODE -ne 0) {
            throw "doctor.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Scan for secrets
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\scan-secrets.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'scripts/scan-secrets.ps1 is missing; the secret scan gate is required.'
          }

          $scanJson = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-secret-scan.json'
          & pwsh -NoProfile -File $scriptPath -JsonPath $scanJson
          if ($LASTEXITCODE -ne 0) {
            throw "scan-secrets.ps1 failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath $scanJson -PathType Leaf)) {
            throw 'Secret scan did not produce its machine-readable JSON summary.'
          }
          $scanReport = Get-Content -Raw -LiteralPath $scanJson | ConvertFrom-Json
          if ([int]$scanReport.SchemaVersion -ne 1 -or $scanReport.Result -ne 'PASS') {
            throw 'Secret scan JSON summary is missing or reports a failure.'
          }

      - name: Build generated skills
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\build-skills.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'scripts/build-skills.ps1 is missing; generated-output validation is required.'
          }

          & pwsh -NoProfile -File $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "build-skills.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Verify build leaves Git clean
        shell: pwsh
        run: |
          $policyPaths = @(
            '.',
            ':(exclude).reasonix/desktop-topic-auto-title-meta.json',
            ':(exclude).reasonix/desktop-topic-created-at.json',
            ':(exclude).reasonix/desktop-topic-title-sources.json',
            ':(exclude).reasonix/desktop-topic-titles.json'
          )
          git diff --quiet --exit-code -- $policyPaths
          if ($LASTEXITCODE -ne 0) {
            git status --short -- $policyPaths
            throw 'Build changed tracked files. Rebuild locally and commit the intended source or manifest changes.'
          }

          $untrackedFiles = @(git ls-files --others --exclude-standard -- $policyPaths)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect untracked files after build.'
          }
          if ($untrackedFiles.Count -gt 0) {
            $untrackedFiles | ForEach-Object { Write-Error "Unexpected untracked file: $_" }
            throw 'Build left unexpected untracked files.'
          }

          $trackedGenerated = @(git ls-files -- claude/skills codex/skills reasonix/skills generated)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect generated output tracking state.'
          }
          if ($trackedGenerated.Count -gt 0) {
            $trackedGenerated | ForEach-Object { Write-Error "Tracked generated output: $_" }
            throw 'Generated output must remain untracked.'
          }

          Write-Host 'Build validation passed: no tracked diff, unexpected untracked files, or tracked generated output.'

      - name: Validate machine-readable schemas and build evidence
        shell: pwsh
        run: |
          $schemaPaths = @(
            'schemas\sync-plan.schema.json',
            'schemas\run-report.schema.json',
            'schemas\doctor-report.schema.json',
            'schemas\secret-scan.schema.json',
            'schemas\harness-env-status.schema.json',
            'schemas\harness-env-lock.schema.json',
            'schemas\harness-env-list.schema.json',
            'schemas\harness-env-build.schema.json',
            'schemas\harness-component.schema.json',
            'schemas\harness-platform-output.schema.json'
          ) | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE $_ }
          foreach ($schemaPath in $schemaPaths) {
            if (-not (Test-Path -LiteralPath $schemaPath -PathType Leaf)) {
              throw "Required schema is missing: $schemaPath"
            }
            Get-Content -Raw -LiteralPath $schemaPath | ConvertFrom-Json | Out-Null
          }

          $buildReports = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'reports') -Filter 'build-report-*.json' -File)
          if ($buildReports.Count -eq 0) {
            throw 'Build did not produce a machine-readable JSON sidecar.'
          }
          $latest = $buildReports | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $report = Get-Content -Raw -LiteralPath $latest.FullName | ConvertFrom-Json
          foreach ($required in @('SchemaVersion', 'ReportKind', 'GeneratedAtUtc', 'Summary', 'Details', 'Result', 'NextAction')) {
            if (-not ($report.PSObject.Properties.Name -contains $required)) {
              throw "Build JSON report is missing required field: $required"
            }
          }
          if ([int]$report.SchemaVersion -ne 1 -or $report.ReportKind -ne 'build') {
            throw 'Build JSON report has an unsupported schema or report kind.'
          }

          $envBuildJson = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-env-build.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\build-harness-env.ps1') -Name work -RepoRoot $env:GITHUB_WORKSPACE -JsonPath $envBuildJson
          if ($LASTEXITCODE -ne 0) { throw "build-harness-env.ps1 failed with exit code $LASTEXITCODE." }
          $envBuild = Get-Content -Raw -LiteralPath $envBuildJson | ConvertFrom-Json
          foreach ($required in @('SchemaVersion', 'GeneratedAtUtc', 'Name', 'Result', 'DefinitionHash', 'TaskOverlayHash', 'TaskOverlaySkills', 'LockHash', 'RepositoryCommit', 'SkillSourceEvidence', 'FileCount')) {
            if (-not ($envBuild.PSObject.Properties.Name -contains $required)) {
              throw "Harness environment build JSON is missing required field: $required"
            }
          }
          if ([int]$envBuild.SchemaVersion -ne 2 -or $envBuild.Name -ne 'work' -or $envBuild.Result -ne 'PASS') {
            throw 'Harness environment build JSON is invalid.'
          }
          $envLockPath = Join-Path $env:GITHUB_WORKSPACE 'envs\work\env.lock.json'
          if (-not (Test-Path -LiteralPath $envLockPath -PathType Leaf)) { throw 'Harness environment lock was not generated.' }
          $envLock = Get-Content -Raw -LiteralPath $envLockPath | ConvertFrom-Json
          foreach ($required in @('SchemaVersion', 'Name', 'DefinitionHash', 'TaskOverlayHash', 'TaskOverlaySkills', 'RepositoryCommit', 'ManifestHashes', 'SkillSourceEvidence', 'SkillSourceHashes', 'StagedSkillTreeHashes', 'ProfileSourceHash', 'ProfileOutputHash', 'BuiltFiles')) {
            if (-not ($envLock.PSObject.Properties.Name -contains $required)) {
              throw "Harness environment lock is missing required field: $required"
            }
          }
          if ([int]$envLock.SchemaVersion -ne 3 -or $envLock.Name -ne 'work') { throw 'Harness environment lock has an unsupported schema or name.' }

          $envListJson = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-env-list.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\list-harness-env.ps1') -RepoRoot $env:GITHUB_WORKSPACE -JsonPath $envListJson
          if ($LASTEXITCODE -ne 0) { throw "list-harness-env.ps1 failed with exit code $LASTEXITCODE." }
          $envList = Get-Content -Raw -LiteralPath $envListJson | ConvertFrom-Json
          if ([int]$envList.SchemaVersion -ne 1 -or $null -eq $envList.Environments) { throw 'Harness environment list JSON is invalid.' }

          $envStatusJson = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-env-status.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\status-harness-env.ps1') -RepoRoot $env:GITHUB_WORKSPACE -JsonPath $envStatusJson
          if ($LASTEXITCODE -ne 0) { throw "status-harness-env.ps1 failed with exit code $LASTEXITCODE." }
          $envStatus = Get-Content -Raw -LiteralPath $envStatusJson | ConvertFrom-Json
          if ([int]$envStatus.SchemaVersion -ne 1 -or -not ($envStatus.PSObject.Properties.Name -contains 'Environments')) {
            throw 'Harness environment JSON status summary is invalid.'
          }
          $workStatus = @($envStatus.Environments | Where-Object { $_.Name -eq 'work' })
          if ($workStatus.Count -ne 1 -or $workStatus[0].StagingStatus -ne 'built' -or $workStatus[0].LockStatus -ne 'valid') {
            throw 'Harness environment status did not attest the freshly built work environment.'
          }
          Write-Host "Machine-readable evidence validated: $latest"

      - name: Parse every current-worktree PowerShell file
        shell: pwsh
        run: |
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\check-powershell-syntax.ps1')
          if ($LASTEXITCODE -ne 0) { throw "PowerShell syntax validation failed with exit code $LASTEXITCODE." }

      - name: Run every root regression suite exactly once
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'ai-agent-dotfiles-test-summary.json'
          & pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\run-tests.ps1') -All -JsonSummaryPath $summaryPath
          if ($LASTEXITCODE -ne 0) { throw "Unified test runner failed with exit code $LASTEXITCODE." }

      - name: Reject dangerous tracked files
        shell: pwsh
        run: |
          $trackedFiles = @(git ls-files)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate tracked files.'
          }

          $violations = foreach ($relativePath in $trackedFiles) {
            $normalizedPath = $relativePath -replace '\\', '/'
            $leafName = [System.IO.Path]::GetFileName($normalizedPath)
            $isForbidden = (
                $leafName -match '(?i)\.(pem|key|p12|pfx)$' -or
                $leafName -match '(?i)^id_(rsa|ed25519)$' -or
                $leafName -match '(?i)^\.env(?:\..+)?$' -or
                $leafName -match '(?i)^\.?tokens?(?:\.(txt|json|ya?ml))?$' -or
                $leafName -match '(?i)\.tokens?$' -or
                $leafName -match '(?i)^(auth|\.credentials)\.json$' -or
                $normalizedPath -match '(?i)(^|/)(backup|backups)(/|$)' -or
                $normalizedPath -match '(?i)(^|/)\.ssh(/|$)'
            )

            if ($isForbidden) {
              $relativePath
            }
          }

          $violations = @($violations)
          if ($violations.Count -gt 0) {
            $violations | Sort-Object -Unique | ForEach-Object { Write-Error "Forbidden tracked file: $_" }
            throw 'Dangerous files are tracked. Remove them from Git history and rotate exposed credentials if necessary.'
          }

          Write-Host 'Dangerous tracked-file check passed.'
